[package]
name = "subway-wrapper"
version = "0.1.0"
description = "Tauri desktop wrapper for web Subway Surfers with OpenCode auto-pause"
authors = ["patrykjaki"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "subway_wrapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
rand = "0.9"
dirs = "6"

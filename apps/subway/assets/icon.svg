<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="trainBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Perspective subway rails -->
  <path d="M230 890 L418 590" stroke="#93c5fd" stroke-width="26" stroke-linecap="round" opacity="0.75"/>
  <path d="M794 890 L606 590" stroke="#93c5fd" stroke-width="26" stroke-linecap="round" opacity="0.75"/>
  <path d="M315 805 H709 M360 725 H664 M398 655 H626" stroke="#60a5fa" stroke-width="18" stroke-linecap="round" opacity="0.5"/>

  <!-- Subway train front -->
  <rect x="292" y="190" width="440" height="470" rx="76" fill="url(#trainBody)" stroke="#0f172a" stroke-width="20"/>
  <!-- Roof stripe -->
  <rect x="332" y="216" width="360" height="36" rx="18" fill="url(#accent)"/>
  <!-- Windshield -->
  <rect x="342" y="280" width="340" height="156" rx="34" fill="#0f172a"/>
  <path d="M366 306 L446 306 L396 410 L366 410 Z" fill="#38bdf8" opacity="0.35"/>
  <!-- Front yellow bumper stripe -->
  <rect x="318" y="468" width="388" height="42" rx="21" fill="url(#accent)"/>
  <!-- Headlights -->
  <circle cx="386" cy="576" r="36" fill="#fef08a" stroke="#0f172a" stroke-width="14"/>
  <circle cx="638" cy="576" r="36" fill="#fef08a" stroke="#0f172a" stroke-width="14"/>
  <!-- Center grille -->
  <rect x="462" y="556" width="100" height="40" rx="14" fill="#334155"/>

  <!-- Pause badge in bottom-right -->
  <circle cx="772" cy="772" r="138" fill="#0f172a" stroke="#38bdf8" stroke-width="18"/>
  <rect x="722" y="712" width="34" height="120" rx="14" fill="#facc15"/>
  <rect x="788" y="712" width="34" height="120" rx="14" fill="#facc15"/>
</svg>
